<!-- ====================================================================
     Promo bar — no offer link on checkout: every pixel here serves the order
     ================================================================= -->
<div class="promo wrap--edge">
  <div class="promo__inner">
    <span class="chip-brand chip-brand--square">Sale</span>
    <span>Summer sale: 30% off All Access with code <span class="promo__code">SUNNY30</span></span>
    <span class="promo__timer">Ends in <span data-countdown>2d 00:00:00</span></span>
  </div>
</div>

<!-- ====================================================================
     Slim checkout header — no nav, no search, nothing that leads away
     ================================================================= -->
<header class="site-header site-header--slim wrap--edge">
  <a href="index.html" class="site-header__logo is-plain">
    <img src="assets/img/yaycommerce-logo.png" alt="YayCommerce">
  </a>

  <div class="secure-mark">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="#4ab866" aria-hidden="true"><path d="M12 4a4 4 0 00-4 4v2H6.5c-.8 0-1.5.7-1.5 1.5v7c0 .8.7 1.5 1.5 1.5h11c.8 0 1.5-.7 1.5-1.5v-7c0-.8-.7-1.5-1.5-1.5H16V8a4 4 0 00-4-4zm2.5 6h-5V8a2.5 2.5 0 015 0v2z"/></svg>
    Secure checkout
  </div>

  <div class="site-header__actions">
    <span class="muted">Questions? <a href="support.html">Chat with us</a></span>
    <a href="account.html" class="account-chip is-plain">
      <span class="avatar">TN</span>
      <span class="account-chip__name">Trung</span>
    </a>
  </div>
</header>
